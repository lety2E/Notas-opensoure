<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }
        .header {
            background: #333;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            position: relative; /* Añadimos esta línea para permitir la imagen de fondo */
        }
        h1 {
            font-size: 24px;
            margin: 0;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #333;
            opacity: 0.7;
            z-index: -1;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Portada Minimalista</h1>
</div>

<!-- Aquí puedes agregar contenido personalizado -->
<p>Datos de la página:</p>
<ul>
    <li>Teléfono: 555555</li>
    <li>Dirección: Tu domicilio aquí</li>
</ul>

<!-- Imagen de fondo si lo deseas -->
<img src="https://via.placeholder.com/1920x1080?text=Portada+Minimalista" alt="Imagen de fondo" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
</body>
</html>
